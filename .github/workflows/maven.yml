
name: Selenium TestNG Maven CI

# Trigger the pipeline
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  selenium-automation:

    # GitHub virtual machine
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout project code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Step 3: Check Java version
      - name: Check Java Version
        run: java -version

      # Step 4: Check Maven version
      - name: Check Maven Version
        run: mvn -version

      # Step 5: Execute Selenium TestNG tests
      - name: Run Selenium Tests
        run: mvn clean test

      # Step 6: Upload execution reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-TestNG-Reports
          path: |
            target/surefire-reports/
          if-no-files-found: warn
